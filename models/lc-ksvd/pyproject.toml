[project]
name = "lc-ksvd"
version = "0.1.0"
description = "Implementation of LC-KSVD"
requires-python = ">=3.12"
dependencies = [
    "cupy-cuda13x>=14.1.0",
    "lungmask>=0.2.21",
    "matplotlib>=3.10.9",
    "nibabel>=5.4.2",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "reppi==0.1.39",
    "scikit-image>=0.26.0",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.12.0",
    "torchvision>=0.27.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
